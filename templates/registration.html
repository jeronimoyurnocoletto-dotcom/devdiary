<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - DevDiary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <a href="{{ url_for('index') }}" class="logo-link">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" width="40" height="40">
            <span class="logo-text">DevDiary</span>
        </a>
    </header>
    <main class="main-login">
        <form action="{{ url_for('reg_post') }}" method="post" class="form__card">
            <h2>Crea tu cuenta</h2>

            {% if error %}
            <p class="error-msg">{{ error }}</p>
            {% endif %}

            <div class="form__inputs">
                <label for="email" class="form__label">
                    Correo electrónico
                    <input class="form__input" type="email" name="email" id="email" placeholder="Ingresa tu e-mail" required>
                </label>
                <label for="password" class="form__label">
                    Contraseña
                    <input class="form__input" type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required>
                </label>
            </div>

            <button type="submit" class="form__button">Crear cuenta</button>
            <p class="form__alt">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
        </form>
    </main>
</body>
</html>
